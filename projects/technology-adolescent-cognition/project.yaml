context_raw:
  description: This is a systematic review examining how technology and media use
    affects cognitive processes relevant to learning in adolescents. The review synthesises
    existing research (including meta-analyses and recent empirical studies from 2023
    onwards) to understand the advantages and challenges posed by digital technology
    use, with an eye toward informing educational strategies and learning environment
    design.
  population: Adolescents, generally defined as individuals aged approximately 11-19
    years (consistent with WHO definitions). The review focuses on this age group
    specifically because adolescence represents a critical developmental window for
    executive function maturation, during which the prefrontal cortex undergoes significant
    neural reorganisation.
  constructs: 'Independent variables: Technology/media use (smartphones, social media,
    internet use, screen time, problematic digital engagement), Media multitasking.
    Dependent variables: Inhibitory control, Working memory, Cognitive flexibility,
    Sustained attention, Planning and self-regulation. Theoretical frameworks: Scattered
    attention hypothesis (Ophir et al., 2009), Cognitive offloading (Risko & Gilbert,
    2016).'
  focus: Executive functions - the cognitive control mechanisms that support goal-directed
    behaviour and adaptive learning in educational contexts
