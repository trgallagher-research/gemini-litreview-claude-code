research_questions:
- id: RQ1
  text: How does technology influence cognitive processes relevant for learning?
  keywords:
  - technology
  - cognitive processes
  - learning
  - digital media
  - executive functions
- id: RQ1.1
  text: To what extent does frequent digital media multitasking and smartphone use
    impact adolescents' attention spans and executive functions (e.g., working memory,
    inhibitory control) in learning contexts?
  keywords:
  - media multitasking
  - smartphone use
  - attention span
  - executive functions
  - working memory
  - inhibitory control
  - adolescents
